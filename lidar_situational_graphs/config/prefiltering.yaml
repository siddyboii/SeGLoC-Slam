/**:
  ros__parameters:
    use_sim_time: True
    base_link_frame: "base_link"
    use_distance_filter: true
    distance_near_thresh: 0.3
    distance_far_thresh: 50.0
    downsample_method: "VOXELGRID"
    downsample_resolution: 0.05      # finer voxels → more points → better ICP (was 0.1)
    outlier_removal_method: "RADIUS"
    statistical_mean_k: 30
    statistical_stddev: 1.2
    radius_min_neighbors: 2          # must be integer ≥ 1 (was 0.5 → cast to 0, broken)
    radius_radius: 0.5               # 0.5m neighborhood (was 2.0m, way too large for 2D)
